<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Mini Farm</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      background: #d9edc2;
      color: #31572c;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .panel {
      max-width: 1000px;
      margin: auto;
      padding: 18px;
      background: #eff8e7;
      border: 3px solid #709b55;
      border-radius: 16px;
    }

    h1 { margin: 8px 0; }

    button {
      margin: 5px;
      padding: 10px 14px;
      border: 2px solid #527d38;
      border-radius: 8px;
      background: #70a34b;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: #527d38; }
    button:disabled { opacity: 0.5; cursor: default; }
    button.active { outline: 4px solid #f3bd45; }

    #menu { padding: 75px 12px; }
    #game { display: none; }

    #status {
      min-height: 28px;
      margin: 8px;
      font-weight: bold;
    }

    #farm {
      display: block;
      width: 100%;
      max-width: 1000px;
      height: auto;
      margin: 0 auto;
      border-radius: 10px;
      cursor: pointer;
    }

    #inventory {
      margin-top: 12px;
      padding: 10px;
      border-radius: 10px;
      background: #d9edc2;
    }

    #modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 5;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: #0008;
    }

    #modal-box {
      width: min(520px, 100%);
      max-height: 85vh;
      overflow-y: auto;
      padding: 18px;
      border: 3px solid #709b55;
      border-radius: 14px;
      background: #eff8e7;
    }

    .shop-row, .market-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 8px 0;
      padding: 8px;
      border-bottom: 1px solid #b8cfa5;
      text-align: left;
    }

    .row-info { flex: 1; }
    .stock { min-width: 95px; font-size: 13px; }
  </style>
</head>
<body>
  <main class="panel">
    <section id="menu">
      <h1>My Mini Farm</h1>
      <p>Plant, water, and harvest your own crops!</p>
      <button id="play-button">Play</button>
    </section>

    <section id="game">
      <header>
        <h1>My Farm</h1>
        <strong id="day-weather">DAY 1 | SUNNY</strong>
        <strong id="coins">Coins: 20</strong>
      </header>

      <nav>
        <button id="shop-button">Shop</button>
        <button id="market-button">Marketplace</button>
        <button id="water-button">Watering Can</button>
        <button id="harvest-button">Harvest</button>
      </nav>

      <div id="status">Choose seeds from your inventory, then click an empty plot.</div>
      <canvas id="farm" width="1000" height="520"></canvas>
      <div id="inventory"><strong>Seeds:</strong> <span id="seed-buttons"></span></div>
    </section>
  </main>

  <div id="modal">
    <div id="modal-box">
      <button id="close-modal" style="float:right">Close</button>
      <h2 id="modal-title"></h2>
      <div id="modal-content"></div>
    </div>
  </div>

  <script>
    const PLANTS = {
      "Carrot": {
        price: 5, sale: 10, chance: 0.90, stock: [1, 6],
        growth: 40, extraWater: 0,
        stem: "#27632a", leaf1: "#48a848", leaf2: "#55b84f"
      },
      "Tomato": {
        price: 15, sale: 20, chance: 0.75, stock: [1, 3],
        growth: 60, extraWater: 1,
        stem: "#27632a", leaf1: "#328c39", leaf2: "#55b84f"
      },
      "Strawberry": {
        price: 25, sale: 35, chance: 0.55, stock: [1, 3],
        growth: 60, extraWater: 2,
        stem: "#27632a", leaf1: "#226b35", leaf2: "#68c75e"
      },
      "Pumpkin": {
        price: 50, sale: 75, chance: 0.35, stock: [1, 2],
        growth: 90, extraWater: 3,
        stem: "#496b25", leaf1: "#537c2b", leaf2: "#83a83e"
      },
      "Golden Flower": {
        price: 250, sale: 500, chance: 0.05, stock: [1, 1],
        growth: 120, extraWater: 3,
        stem: "#347342", leaf1: "#4b9b51", leaf2: "#7fcf63"
      },
      "Dragon Fruit": {
        price: 1000, sale: 5000, chance: 0.01, stock: [1, 1],
        growth: 180, extraWater: 5, boss: true,
        stem: "#315c35", leaf1: "#338e52", leaf2: "#66c77a"
      }
    };

    const plots = [null, null, null];
    const seeds = Object.fromEntries(Object.keys(PLANTS).map(name => [name, 0]));
    const harvest = Object.fromEntries(Object.keys(PLANTS).map(name => [name, 0]));
    const stock = {};

    const canvas = document.getElementById("farm");
    const ctx = canvas.getContext("2d");
    const statusBox = document.getElementById("status");

    const plotPositions = [
      [90, 220, 330, 430],
      [380, 220, 620, 430],
      [670, 220, 910, 430]
    ];

    let coins = 20;
    let tool = "Carrot";
    let weather = "Sunny";
    let gameStart = 0;
    let nextWeather = 0;
    let nextStock = Date.now() + 300000;
    let shopOpen = false;
    let marketOpen = false;

    function randomStock() {
      for (const [name, data] of Object.entries(PLANTS)) {
        stock[name] = Math.random() < data.chance
          ? Math.floor(Math.random() * (data.stock[1] - data.stock[0] + 1)) + data.stock[0]
          : 0;
      }
    }

    randomStock();

    function setStatus(message) {
      statusBox.textContent = message;
    }

    function updateInventory() {
      const holder = document.getElementById("seed-buttons");
      holder.innerHTML = "";

      for (const name of Object.keys(PLANTS)) {
        const button = document.createElement("button");
        button.textContent = `${name} seeds: ${seeds[name]}`;
        button.disabled = seeds[name] <= 0;
        button.classList.toggle("active", tool === name);
        button.addEventListener("click", () => {
          tool = name;
          updateInventory();
          drawFarm();
          setStatus(`${name} seeds selected. Click an empty plot.`);
        });
        holder.appendChild(button);
      }
    }

    function updateShop() {
      for (const [index, name] of Object.keys(PLANTS).entries()) {
        const amount = document.getElementById(`stock-${index}`);
        const buy = document.getElementById(`buy-${index}`);
        if (amount) {
          amount.textContent = stock[name] > 0
            ? `In stock: ${stock[name]}`
            : "Out of stock";
        }
        if (buy) buy.disabled = stock[name] <= 0;
      }

      const timer = document.getElementById("shop-timer");
      if (timer) {
        const seconds = Math.max(0, Math.ceil((nextStock - Date.now()) / 1000));
        timer.textContent =
          `New stock in ${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
      }
    }

    function openShop() {
      shopOpen = true;
      marketOpen = false;
      document.getElementById("modal-title").textContent = "Seed Shop";

      const content = document.getElementById("modal-content");
      content.innerHTML = `<p id="shop-timer"></p>`;

      Object.entries(PLANTS).forEach(([name, data], index) => {
        const row = document.createElement("div");
        row.className = "shop-row";
        row.innerHTML = `
          <span class="row-info">${name} — ${data.price} coins</span>
          <span class="stock" id="stock-${index}"></span>
          <button id="buy-${index}" data-name="${name}">Buy</button>
        `;
        content.appendChild(row);
        row.querySelector("button").addEventListener("click", () => buySeed(name));
      });

      document.getElementById("modal").style.display = "flex";
      updateShop();
    }

    function buySeed(name) {
      if (stock[name] <= 0) {
        setStatus(`${name} is out of stock.`);
        return;
      }
      if (coins < PLANTS[name].price) {
        setStatus("You don't have enough coins.");
        return;
      }

      coins -= PLANTS[name].price;
      stock[name]--;
      seeds[name]++;
      document.getElementById("coins").textContent = `Coins: ${coins}`;
      updateInventory();
      updateShop();
      setStatus(`You bought one ${name} seed.`);
    }

    function openMarket() {
      marketOpen = true;
      shopOpen = false;
      document.getElementById("modal-title").textContent = "Marketplace";
      renderMarket();
      document.getElementById("modal").style.display = "flex";
    }

    function renderMarket() {
      const content = document.getElementById("modal-content");
      content.innerHTML = "";

      Object.entries(PLANTS).forEach(([name, data]) => {
        const row = document.createElement("div");
        row.className = "market-row";
        row.innerHTML = `
          <span class="row-info">${name}: <span id="harvest-${name}">${harvest[name]}</span></span>
          <button data-name="${name}" ${harvest[name] === 0 ? "disabled" : ""}>
            Sell all (${data.sale} coins each)
          </button>
        `;
        row.querySelector("button").addEventListener("click", () => sellCrop(name));
        content.appendChild(row);
      });
    }

    function sellCrop(name) {
      if (harvest[name] <= 0) return;
      const earnings = harvest[name] * PLANTS[name].sale;
      coins += earnings;
      harvest[name] = 0;
      document.getElementById("coins").textContent = `Coins: ${coins}`;
      setStatus(`Sold your ${name}. You earned ${earnings} coins.`);
      renderMarket();
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
      shopOpen = false;
      marketOpen = false;
    }

    function selectTool(name) {
      tool = name;
      document.querySelectorAll("nav button").forEach(button => button.classList.remove("active"));
      if (name === "Water") document.getElementById("water-button").classList.add("active");
      if (name === "Harvest") document.getElementById("harvest-button").classList.add("active");
      updateInventory();
      drawFarm();
    }

    function plantCrop(index) {
      const name = tool;
      if (!(name in PLANTS)) {
        setStatus("Choose seeds from your inventory first.");
        return;
      }
      if (seeds[name] <= 0) {
        setStatus(`You have no ${name} seeds. Buy some in the Shop.`);
        return;
      }

      seeds[name]--;
      const data = PLANTS[name];
      plots[index] = {
        name,
        growth: 0,
        started: null,
        lastUpdate: null,
        watered: [false, false, false],
        waiting: false,
        deadline: null,
        boss: Boolean(data.boss),
        extraWater: data.extraWater,
        waterRound: 0
      };

      updateInventory();
      setStatus("Seed planted! Water all three blue spots to start.");
      drawFarm();
    }

    function pointOnWaterSpot(index, mouseX, mouseY) {
      const [x1, y1] = plotPositions[index];
      const y = y1 + 165;

      for (let spot = 0; spot < 3; spot++) {
        const x = x1 + 55 + spot * 65;
        if (Math.hypot(mouseX - x, mouseY - y) <= 22) return spot;
      }
      return -1;
    }

    function waterCrop(index, spot) {
      const plant = plots[index];

      if (!plant.started) {
        if (plant.watered[spot]) {
          setStatus("This spot is already watered.");
          return;
        }

        plant.watered[spot] = true;
        if (plant.watered.every(Boolean)) {
          plant.started = Date.now();
          plant.lastUpdate = Date.now();
          setStatus("Watering complete! The crop is growing.");
        } else {
          setStatus("Water the other blue spots too.");
        }
      } else {
        if (!plant.waiting) {
          setStatus("This crop does not need water right now.");
          return;
        }

        if (plant.watered[spot]) {
          setStatus("This spot is already watered.");
          return;
        }

        plant.watered[spot] = true;
        if (plant.watered.every(Boolean)) {
          plant.waiting = false;
          plant.deadline = null;
          plant.waterRound++;
          plant.lastUpdate = Date.now();
          setStatus("Watering complete! Growth continues.");
        } else {
          setStatus("Water the other blue spots before time runs out.");
        }
      }

      drawFarm();
    }

    function handleFarmClick(event) {
      const rect = canvas.getBoundingClientRect();
      const mouseX = (event.clientX - rect.left) * canvas.width / rect.width;
      const mouseY = (event.clientY - rect.top) * canvas.height / rect.height;

      for (let index = 0; index < plotPositions.length; index++) {
        const [x1, y1, x2, y2] = plotPositions[index];
        if (mouseX < x1 || mouseX > x2 || mouseY < y1 || mouseY > y2) continue;

        if (!plots[index]) {
          plantCrop(index);
          return;
        }

        if (tool === "Water") {
          const spot = pointOnWaterSpot(index, mouseX, mouseY);
          if (spot < 0) {
            setStatus("Click one of the blue watering spots.");
            return;
          }
          waterCrop(index, spot);
          return;
        }

        if (tool !== "Harvest") {
          setStatus("Select the Watering Can or Harvest tool.");
          return;
        }

        const plant = plots[index];
        const duration = PLANTS[plant.name].growth;

        if (!plant.started) {
          setStatus("Water all three spots in the plot first.");
          return;
        }
        if (plant.waiting) {
          setStatus("This crop needs water before it can grow or be harvested.");
          return;
        }
        if (plant.growth < duration) {
          setStatus(`Not ripe yet — wait ${(duration - plant.growth).toFixed(1)} seconds.`);
          return;
        }

        const yieldAmount = Math.floor(Math.random() * 3) + 1;
        harvest[plant.name] += yieldAmount;
        setStatus(`Harvested ${yieldAmount} ${plant.name}(s). Sell them in the Marketplace.`);
        plots[index] = null;
        if (marketOpen) renderMarket();
        drawFarm();
        return;
      }
    }

    function updatePlants(now) {
      for (let index = 0; index < plots.length; index++) {
        const plant = plots[index];
        if (!plant || !plant.started) continue;

        if (plant.waiting) {
          if (plant.boss && now >= plant.deadline) {
            plots[index] = null;
            setStatus("The Dragon Fruit withered because it was not watered in time!");
          }
          continue;
        }

        const elapsed = Math.max(0, (now - plant.lastUpdate) / 1000);
        plant.lastUpdate = now;
        const speed = weather === "Rain" ? 1.5 : 1;
        const duration = PLANTS[plant.name].growth;
        plant.growth = Math.min(duration, plant.growth + elapsed * speed);

        const waterCount = plant.extraWater;
        if (waterCount > 0 && plant.waterRound < waterCount) {
          const nextWaterAt = duration * (plant.waterRound + 1) / (waterCount + 1);
          if (plant.growth >= nextWaterAt) {
            plant.growth = nextWaterAt;
            plant.waiting = true;
            plant.watered = [false, false, false];

            if (plant.boss) {
              plant.deadline = now + 15000;
              setStatus("Dragon Fruit needs water now! You have 15 seconds!");
            } else {
              setStatus(`${plant.name} needs water. Growth is paused; it will not be lost.`);
            }
          }
        }
      }
    }

    function drawPlant(index, x1, y1, x2) {
      const plant = plots[index];
      const data = PLANTS[plant.name];
      const growth = plant.started
        ? Math.min(1, plant.growth / data.growth)
        : 0.15;

      const baseY = y1 + 150;
      const height = 15 + growth * 45;
      const stemTop = baseY - height;

      for (const x of [x1 + 65, x1 + 120, x1 + 175]) {
        const leafSize = 7 + growth * 12;
        ctx.strokeStyle = data.stem;
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(x, baseY);
        ctx.lineTo(x, stemTop);
        ctx.stroke();

        ctx.fillStyle = data.leaf1;
        ctx.beginPath();
        ctx.ellipse(x - leafSize, stemTop + 13, leafSize, 6, -0.3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = data.leaf2;
        ctx.beginPath();
        ctx.ellipse(x + leafSize, stemTop + 7, leafSize, 6, 0.3, 0, Math.PI * 2);
        ctx.fill();
      }

      if (plant.started && plant.growth >= data.growth) {
        for (const x of [x1 + 65, x1 + 120, x1 + 175]) {
          const y = y1 + 137;
          ctx.fillStyle = "#e53935";

          if (plant.name === "Carrot") {
            ctx.fillStyle = "#ff8c00";
            ctx.beginPath();
            ctx.moveTo(x - 9, y - 13);
            ctx.lineTo(x + 9, y - 13);
            ctx.lineTo(x, y + 15);
            ctx.closePath();
            ctx.fill();
          } else if (plant.name === "Pumpkin") {
            ctx.fillStyle = "#f28c28";
            ctx.beginPath();
            ctx.ellipse(x, y, 15, 13, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#a95116";
            ctx.beginPath();
            ctx.moveTo(x, y - 12);
            ctx.lineTo(x, y + 12);
            ctx.stroke();
          } else if (plant.name === "Golden Flower") {
            ctx.fillStyle = "#ffd700";
            for (const [dx, dy] of [[0, -10], [10, 0], [0, 10], [-10, 0]]) {
              ctx.beginPath();
              ctx.arc(x + dx, y + dy, 7, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.fillStyle = "#7a4b20";
            ctx.beginPath();
            ctx.arc(x, y, 5, 0, Math.PI * 2);
            ctx.fill();
          } else if (plant.name === "Dragon Fruit") {
            ctx.fillStyle = "#d927a9";
            ctx.beginPath();
            ctx.ellipse(x, y, 14, 10, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#58a832";
            for (const dx of [-10, 0, 10]) {
              ctx.beginPath();
              ctx.moveTo(x + dx, y - 7);
              ctx.lineTo(x + dx - 3, y - 15);
              ctx.lineTo(x + dx + 5, y - 7);
              ctx.fill();
            }
          } else {
            ctx.beginPath();
            ctx.arc(x, y, plant.name === "Strawberry" ? 11 : 12, 0, Math.PI * 2);
            ctx.fill();

            if (plant.name === "Strawberry") {
              ctx.fillStyle = "#58a832";
              ctx.beginPath();
              ctx.ellipse(x, y - 10, 8, 4, 0, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }
      }
    }

    function drawFarm() {
      const now = Date.now();
      const sky = weather === "Rain" ? "#657b89"
        : weather === "Cloudy" ? "#93a2a7" : "#9bd6f2";
      const grass = weather === "Rain" ? "#547a43"
        : weather === "Cloudy" ? "#68925b" : "#72b85a";

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, 1000, 520);

      ctx.fillStyle = grass;
      ctx.fillRect(0, 350, 1000, 170);
      ctx.beginPath();
      ctx.ellipse(500, 500, 600, 220, 0, 0, Math.PI * 2);
      ctx.fill();

      if (weather === "Sunny") {
        ctx.fillStyle = "#ffdb58";
        ctx.beginPath();
        ctx.arc(885, 62, 38, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = weather === "Rain" ? "#59666d"
        : weather === "Cloudy" ? "#77848a" : "white";

      for (const [x, y] of [[270, 55], [520, 85]]) {
        for (const [dx, dy, rx, ry] of [[0, 8, 35, 17], [30, 0, 35, 25], [60, 8, 35, 17]]) {
          ctx.beginPath();
          ctx.ellipse(x + dx, y + dy, rx, ry, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      if (weather === "Rain") {
        ctx.strokeStyle = "#d8f0f7";
        ctx.lineWidth = 2;
        const offset = (now / 8) % 70;
        for (let x = 30; x < 980; x += 75) {
          for (let y = -50; y < 520; y += 90) {
            ctx.beginPath();
            ctx.moveTo(x, (y + offset) % 550);
            ctx.lineTo(x - 8, (y + offset) % 550 + 16);
            ctx.stroke();
          }
        }
      }

      // Barn
      ctx.fillStyle = "#c85b45";
      ctx.fillRect(35, 110, 145, 135);
      ctx.strokeStyle = "#713c32";
      ctx.lineWidth = 5;
      ctx.strokeRect(35, 110, 145, 135);
      ctx.fillStyle = "#713c32";
      ctx.beginPath();
      ctx.moveTo(20, 115);
      ctx.lineTo(108, 50);
      ctx.lineTo(195, 115);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#70452f";
      ctx.fillRect(85, 175, 45, 70);

      // Tree
      ctx.fillStyle = "#795548";
      ctx.fillRect(830, 130, 20, 70);
      ctx.fillStyle = "#388e3c";
      ctx.beginPath();
      ctx.arc(840, 125, 45, 0, Math.PI * 2);
      ctx.fill();

      // Path and fence
      ctx.fillStyle = "#c9a978";
      ctx.beginPath();
      ctx.moveTo(430, 520);
      ctx.lineTo(570, 520);
      ctx.lineTo(545, 405);
      ctx.lineTo(455, 405);
      ctx.fill();

      ctx.strokeStyle = "#795548";
      ctx.lineWidth = 4;
      for (let x = 220; x < 800; x += 35) {
        ctx.beginPath();
        ctx.moveTo(x, 175);
        ctx.lineTo(x, 215);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.moveTo(215, 185);
      ctx.lineTo(805, 185);
      ctx.moveTo(215, 202);
      ctx.lineTo(805, 202);
      ctx.stroke();

      plotPositions.forEach(([x1, y1, x2, y2], index) => {
        ctx.fillStyle = "#704523";
        ctx.fillRect(x1, y1, x2 - x1, y2 - y1);
        ctx.strokeStyle = "#9a673a";
        ctx.lineWidth = 10;
        ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

        ctx.strokeStyle = "#9a673a";
        ctx.lineWidth = 3;
        for (let y = y1 + 105; y < y2 - 10; y += 18) {
          ctx.beginPath();
          ctx.moveTo(x1 + 18, y);
          ctx.lineTo(x2 - 18, y);
          ctx.stroke();
        }

        const plant = plots[index];
        if (!plant) {
          ctx.fillStyle = "#f5deb3";
          ctx.font = "bold 16px Arial";
          ctx.textAlign = "center";
          ctx.fillText("Empty plot", (x1 + x2) / 2, y1 + 50);
          return;
        }

        drawPlant(index, x1, y1, x2);

        let label = "Not watered yet";
        if (plant.started) {
          if (plant.waiting) {
            if (plant.boss) {
              label = `WATER NOW! ${Math.max(0, Math.ceil((plant.deadline - now) / 1000))}s`;
            } else {
              label = "Needs water — growth paused";
            }
          } else if (plant.growth >= PLANTS[plant.name].growth) {
            label = "Ready to harvest!";
          } else {
            label = `Growing: ${(PLANTS[plant.name].growth - plant.growth).toFixed(1)}s`;
          }
        }

        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.font = "bold 16px Arial";
        ctx.fillText(plant.name, (x1 + x2) / 2, y1 + 35);
        ctx.font = "bold 12px Arial";
        ctx.fillText(label, (x1 + x2) / 2, y1 + 65);

        const progress = plant.started
          ? Math.min(1, plant.growth / PLANTS[plant.name].growth)
          : 0;

        ctx.fillStyle = "#eeeeee";
        ctx.fillRect(x1 + 40, y1 + 190, x2 - x1 - 80, 10);
        ctx.fillStyle = "#42a85a";
        ctx.fillRect(x1 + 40, y1 + 190, (x2 - x1 - 80) * progress, 10);

        for (let spot = 0; spot < 3; spot++) {
          const x = x1 + 55 + spot * 65;
          const y = y1 + 165;
          ctx.fillStyle = plant.watered[spot] ? "#b8eaff" : "#42c5f5";
          ctx.beginPath();
          ctx.arc(x, y, 13, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "white";
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      });

      ctx.fillStyle = "#31572c";
      ctx.textAlign = "center";
      ctx.font = "bold 12px Arial";
      ctx.fillText("Selected tool", 960, 445);
      ctx.font = "24px Arial";
      ctx.fillText(tool === "Water" ? "🪣" : tool === "Harvest" ? "✂️" : "🌱", 960, 480);
    }

    function tick() {
      const now = Date.now();

      if (now >= nextStock) {
        randomStock();
        nextStock = now + 300000;
        updateShop();
      }

      if (now >= nextWeather) {
        weather = ["Sunny", "Cloudy", "Rain"][Math.floor(Math.random() * 3)];
        nextWeather = now + 60000;
      }

      updatePlants(now);
      document.getElementById("coins").textContent = `Coins: ${coins}`;
      document.getElementById("day-weather").textContent =
        `DAY ${Math.floor((now - gameStart) / 60000) + 1} | ${weather}`;

      if (marketOpen) renderMarket();
      drawFarm();
    }

    document.getElementById("play-button").addEventListener("click", () => {
      document.getElementById("menu").style.display = "none";
      document.getElementById("game").style.display = "block";
      gameStart = Date.now();
      nextWeather = gameStart + 60000;
      weather = ["Sunny", "Cloudy", "Rain"][Math.floor(Math.random() * 3)];
      updateInventory();
      tick();
      setInterval(tick, 100);
    });

    document.getElementById("shop-button").addEventListener("click", openShop);
    document.getElementById("market-button").addEventListener("click", openMarket);
    document.getElementById("water-button").addEventListener("click", () => selectTool("Water"));
    document.getElementById("harvest-button").addEventListener("click", () => selectTool("Harvest"));
    document.getElementById("close-modal").addEventListener("click", closeModal);
    document.getElementById("modal").addEventListener("click", event => {
      if (event.target.id === "modal") closeModal();
    });
    canvas.addEventListener("click", handleFarmClick);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && document.getElementById("game").style.display !== "none") tick();
    });
  </script>
</body>
</html>
